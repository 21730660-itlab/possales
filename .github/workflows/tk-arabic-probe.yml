name: Tk Arabic probe
on:
  push:
    paths: ["tools/tk_arabic_probe.py", ".github/workflows/tk-arabic-probe.yml"]
permissions:
  contents: write  # pushes the screenshot to the ci-screenshots branch
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python tools/tk_arabic_probe.py
      - name: Publish screenshots to the ci-screenshots branch
        shell: bash
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots from run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
